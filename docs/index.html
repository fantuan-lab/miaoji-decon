<!DOCTYPE html><html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>会议学习复盘库</title>
<style>
:root{--paper:#f5f5f7;--paper2:#fff;--side:#fbfbfd;--ink:#1d1d1f;--ink2:#3d3d43;--muted:#6e6e73;--line:#d2d2d7;--line2:#e5e5ea;--accent:#0071e3;--accent2:#2997ff;--soft:#eef5ff;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{color:var(--ink);background:var(--paper);font-family:var(--sans);font-size:16px;line-height:1.72;-webkit-text-size-adjust:100%;font-feature-settings:"kern"}
/* 密码门 */
.gate{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#fff 0%,var(--paper) 100%)}
.gate .card{width:min(390px,88vw);text-align:center;padding:0 20px}
.gate .seal{width:76px;height:76px;border:1px solid rgba(0,0,0,.08);border-radius:18px;color:#fff;background:linear-gradient(180deg,#3aa7ff 0%,var(--accent) 100%);font-weight:700;font-size:25px;letter-spacing:-.02em;line-height:1;display:grid;place-content:center;margin:0 auto 22px;box-shadow:0 18px 38px rgba(0,113,227,.22)}
.gate h1{font-weight:700;font-size:30px;letter-spacing:0;margin:0 0 8px}
.gate p{color:var(--muted);font-size:14px;margin:0 0 26px}
.gate input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:var(--paper2);font-size:16px;color:var(--ink);outline:none;text-align:center;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.gate input:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(0,113,227,.12)}
.gate button{margin-top:12px;width:100%;padding:12px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-size:15px;font-weight:600;font-family:var(--sans);cursor:pointer}
.gate button:hover{background:#0077ed}
.gate .err{color:#d70015;font-size:13px;height:18px;margin-top:10px}
.app{display:none;height:100vh;overflow:hidden}.app.on{display:flex}
.side{width:336px;flex:0 0 336px;background:rgba(251,251,253,.92);border-right:1px solid var(--line2);display:flex;flex-direction:column;height:100vh;backdrop-filter:saturate(180%) blur(18px)}
.side .brand{padding:22px 20px 14px}.side .brand .k{color:var(--accent);font-size:12px;font-weight:600;letter-spacing:0;text-transform:none}
.side .brand h1{font-weight:700;font-size:22px;letter-spacing:0;margin:5px 0 2px}.side .brand .c{color:var(--muted);font-size:12px}
.side .search{padding:8px 16px 12px}.side .search input{width:100%;padding:9px 12px;border:1px solid var(--line2);border-radius:8px;background:#fff;font-size:14px;color:var(--ink);outline:none;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.side .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.11)}
.list{flex:1;overflow-y:auto;padding:0 10px 30px}
.row{display:block;padding:11px 12px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.row:hover{background:#f1f1f4}.row.active{background:#fff;border-color:var(--line2);box-shadow:0 1px 4px rgba(0,0,0,.05)}
.row .t{font-weight:600;font-size:14px;line-height:1.42;letter-spacing:0}.row .d{color:var(--muted);font-size:12px;margin-top:2px}
.row .tags{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap}.row .tags i{font-style:normal;font-size:10px;color:var(--muted);border:1px solid var(--line2);padding:1px 6px;border-radius:999px;background:#fff}
.count{color:var(--muted);font-size:12px;padding:4px 22px 8px}
.main{flex:1;overflow-y:auto;height:100vh;background:#fff}.wrap{max-width:820px;margin:0 auto;padding:46px 36px 120px}
article h1.title{font-weight:700;font-size:34px;line-height:1.2;letter-spacing:0;margin:0 0 6px}
article .meta{color:var(--muted);font-size:13px;border-bottom:1px solid var(--line2);padding-bottom:20px;margin-bottom:10px}
article h2{font-weight:700;font-size:24px;letter-spacing:0;margin:44px 0 10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
article h3{font-weight:700;font-size:17px;letter-spacing:0;margin:24px 0 6px}
article p{margin:12px 0;color:var(--ink2)}article strong{color:var(--ink);font-weight:650}
article ul,article ol{padding-left:0;list-style:none}article ol{counter-reset:li}
article li{margin:11px 0;padding-left:22px;position:relative;color:var(--ink2)}
article ul li::before{content:"";position:absolute;left:3px;top:.78em;width:5px;height:5px;background:var(--accent);border-radius:50%}
article ol li::before{counter-increment:li;content:counter(li);position:absolute;left:0;top:.05em;color:var(--accent);font-weight:700;font-size:13px}
article a{color:var(--accent);text-decoration:none;border-bottom:1px solid rgba(0,113,227,.22);word-break:break-all}
article a:hover{border-bottom-color:var(--accent)}
article code{font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:#0b5cad;background:var(--soft);border:1px solid #d7e8ff;padding:1px 7px;border-radius:999px;white-space:nowrap}
article :is(h1,h2,h3) code{all:unset}
article blockquote{margin:16px 0;padding:15px 18px;background:#f5f5f7;border:1px solid var(--line2);border-left:3px solid var(--accent);border-radius:8px;color:var(--ink2);font-size:15px}
article blockquote strong{color:var(--ink)}
.tablewrap{overflow-x:auto;margin:16px 0}article table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:440px}
article th,article td{border-bottom:1px solid var(--line);padding:10px 12px;text-align:left;vertical-align:top}
article th:first-child,article td:first-child{white-space:nowrap}
article thead th{font-weight:700;border-bottom:1px solid var(--ink)}
hr{border:0;height:1px;background:var(--line2);margin:40px 0}
.menu-btn{display:none}
@media(max-width:880px){
 .side{position:fixed;z-index:30;left:0;top:0;transform:translateX(-100%);transition:.25s;box-shadow:10px 0 30px rgba(0,0,0,.12)}
 .app.open .side{transform:translateX(0)}
 .menu-btn{display:flex;position:fixed;z-index:40;top:12px;right:12px;width:42px;height:42px;border-radius:999px;background:var(--accent);color:#fff;border:none;align-items:center;justify-content:center;font-size:20px}
 .scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}.app.open .scrim{display:block}
 .wrap{padding:64px 20px 90px}article h1.title{font-size:28px}
}
</style></head><body>
<div class="gate" id="gate"><div class="card">
  <div class="seal">M</div>
  <h1>会议学习复盘库</h1><p>内部资料 · 请输入访问密码</p>
  <input id="pw" type="password" placeholder="密码" autocomplete="off">
  <button id="go">进入</button>
  <div class="err" id="err"></div>
</div></div>
<button class="menu-btn" id="menuBtn" style="display:none">☰</button>
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>
  <aside class="side">
    <div class="brand"><div class="k">Meeting Learning Digest</div><h1>会议学习复盘库</h1><div class="c">道法术器势 · 点左侧任意一篇查看</div></div>
    <div class="search"><input id="q" placeholder="搜索标题 / 日期…" autocomplete="off"></div>
    <div class="count" id="count"></div><div class="list" id="list"></div>
  </aside>
  <main class="main" id="main"><div class="wrap"><article id="content"></article></div></main>
</div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let ITEMS=[],CONTENTS={},active=null;
const R=new marked.Renderer();const ot=R.table.bind(R);R.table=(h,b)=>`<div class="tablewrap">${ot(h,b)}</div>`;
marked.setOptions({renderer:R,gfm:true,breaks:false});
async function unlock(pw){
  const e=await (await fetch('enc.json')).json();
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(e.salt),iterations:e.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(e.iv)},key,b64(e.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}
const listEl=document.getElementById('list'),qEl=document.getElementById('q'),countEl=document.getElementById('count'),
      contentEl=document.getElementById('content'),mainEl=document.getElementById('main'),app=document.getElementById('app');
function rowHtml(it){const tags=(it.scenes||[]).map(s=>`<i>${s}</i>`).join('');
  return `<div class="row" data-slug="${it.slug}"><div class="t">${it.title}</div><div class="d">${it.date||''}</div><div class="tags">${tags}</div></div>`;}
function render(list){listEl.innerHTML=list.map(rowHtml).join('');countEl.textContent=`共 ${list.length} 篇`;
  [...listEl.querySelectorAll('.row')].forEach(r=>r.onclick=()=>openItem(r.dataset.slug,r));}
function openItem(slug,rowEl){if(active)active.classList.remove('active');if(rowEl){active=rowEl;rowEl.classList.add('active');}
  app.classList.remove('open');mainEl.scrollTop=0;const it=ITEMS.find(x=>x.slug===slug);
  contentEl.innerHTML=`<h1 class="title">${it.title}</h1><div class="meta">${it.date||''}</div>`+marked.parse(CONTENTS[slug]||'');location.hash=slug;}
qEl.oninput=()=>{const k=qEl.value.trim().toLowerCase();render(!k?ITEMS:ITEMS.filter(it=>(it.title+' '+it.date).toLowerCase().includes(k)));};
document.getElementById('menuBtn').onclick=()=>app.classList.toggle('open');
document.getElementById('scrim').onclick=()=>app.classList.remove('open');
async function tryEnter(){
  const pw=document.getElementById('pw').value,err=document.getElementById('err');
  err.textContent='解密中…';
  try{const data=await unlock(pw);ITEMS=data.manifest;CONTENTS=data.contents;
    sessionStorage.setItem('pw',pw);
    document.getElementById('gate').style.display='none';document.getElementById('menuBtn').style.display='';
    app.classList.add('on');render(ITEMS);
    const h=location.hash.replace('#','');const first=ITEMS.find(x=>x.slug===h)||ITEMS[0];
    if(first)openItem(first.slug,listEl.querySelector(`[data-slug="${first.slug}"]`));
  }catch(e){err.textContent='密码错误';}
}
document.getElementById('go').onclick=tryEnter;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryEnter();});
const saved=sessionStorage.getItem('pw');
if(saved){document.getElementById('pw').value=saved;tryEnter();}
document.getElementById('pw').focus();
</script></body></html>
